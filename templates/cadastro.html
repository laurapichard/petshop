{% extends "base.html" %}
{% block conteudo %}
<section class="cartao login">
  <h2>Cadastro de funcionário</h2>
  <form method="post">
    <label>Nome completo
      <input type="text" name="nome" required>
    </label>
    <label>Cargo
      <input type="text" name="cargo" placeholder="Ex.: Tosador, Atendente, Veterinário" required>
    </label>
    <label>Telefone
      <input type="text" name="telefone" placeholder="(82) 99999-9999">
    </label>
    <label>Login
      <input type="text" name="login" required>
    </label>
    <label>Senha (mínimo 6 caracteres)
      <input type="password" name="senha" minlength="6" required>
    </label>
    <button type="submit">Cadastrar</button>
  </form>
  <p class="rodape">Já tem conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
</section>
{% endblock %}
