{% extends "base.html" %}
{% block conteudo %}
<h2>Clientes</h2>

<details class="cartao" open>
  <summary>Novo cliente</summary>
  <form method="post" class="linha">
    <input type="text" name="nome" placeholder="Nome completo" required>
    <input type="text" name="telefone" placeholder="Telefone">
    <input type="email" name="email" placeholder="E-mail">
    <input type="text" name="endereco" placeholder="Endereço">
    <button type="submit">Salvar</button>
  </form>
</details>

<table>
  <thead><tr><th>Código</th><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Endereço</th><th></th></tr></thead>
  <tbody>
  {% for c in clientes %}
    <tr>
      <td>{{ c.codigo_cliente }}</td>
      <td>{{ c.nome }}</td>
      <td>{{ c.telefone or '-' }}</td>
      <td>{{ c.email or '-' }}</td>
      <td>{{ c.endereco or '-' }}</td>
      <td>
        <form method="post" action="{{ url_for('excluir_cliente', codigo=c.codigo_cliente) }}"
              onsubmit="return confirm('Excluir o cliente e todos os seus pets?');">
          <button class="perigo" type="submit">Excluir</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="6">Nenhum cliente cadastrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
