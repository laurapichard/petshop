{% extends "base.html" %}
{% block conteudo %}
<section class="cartao login">
  <h2>Acesso dos funcionários</h2>
  <form method="post">
    <label>Login
      <input type="text" name="login" required autofocus>
    </label>
    <label>Senha
      <input type="password" name="senha" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
  <p class="rodape">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
